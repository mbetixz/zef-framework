# ZEF Framework — architecture conformance (hexagonal layering).
#
#   composer deptrac
#
# Base layers mirror the physical directories produced by the v2.7.0
# hexagonal split: Domain has zero outward dependencies, Application may
# only depend on Domain, Infrastructure on Domain+Application, and
# Adapters/App/Module/Plugin may use everything below them.
#
# Exception layers (deliberate, documented deviations):
#   - Compat:        PSR shim interfaces — pure contracts, allowed everywhere.
#   - RouteDefSpec:  Zef\Framework\Router\RouteDefinition — route spec value
#                    object consumed by the Domain config aggregator.
#   - TrustedProxy:  Zef\Framework\Http\TrustedProxyMatcher — consumed by
#                    the Application-layer client address resolver.
#   - OtlpExporter:  Zef\Framework\Observability\OtlpHttpJsonExporter —
#                    default exporter wired by the Telemetry facade.
#   - OriginPolicySpec: Zef\Framework\Security\OriginPolicy — consumed by
#                    the Domain security policy aggregator.
#   - ContainerImpl: Zef\Framework\Container\Container — the provider
#                    contracts (ServiceProviderInterface & friends) expose
#                    the concrete container in their signatures.
#
# Retired carve-outs (issue #36 exit ramp — history, kept honest):
#   - EnvConfig:     Zef\Framework\Foundation\Env — moved unchanged to
#                    src/Domain/Foundation (pure typed getenv() wrapper); all
#                    38 static call sites now resolve to a Domain class. A
#                    future instance-based EnvInterface port for
#                    composition-root injection stays open on issue #36.
#   - KernelSleeper: Zef\Framework\Runtime\BlockingSleeper — replaced by the
#                    SleeperInterface port + SystemSleeper default in
#                    src/Domain/Runtime; BlockingSleeper itself stays in
#                    Adapters as the untouched static public API.
deptrac:
    paths:
        - ./src
        - ./modules
        - ./plugins
    layers:
        -   name: Domain
            collectors:
                -   type: directory
                    value: src/Domain/.*
        -   name: Application
            collectors:
                -   type: directory
                    value: src/Application/(?!Security/OriginPolicy\.php|Container/Container\.php).*
        -   name: Infrastructure
            collectors:
                -   type: directory
                    value: src/Infrastructure/(?!Observability/OtlpHttpJsonExporter\.php).*
        -   name: Adapters
            collectors:
                -   type: directory
                    value: src/Adapters/(?!Router/RouteDefinition\.php|Http/TrustedProxyMatcher\.php).*
        -   name: Compat
            collectors:
                -   type: directory
                    value: src/Compat/.*
        -   name: App
            collectors:
                -   type: directory
                    value: src/Bootstrap\.php
                -   type: directory
                    value: src/Middleware/.*
        -   name: Module
            collectors:
                -   type: directory
                    value: modules/.*
        -   name: Plugin
            collectors:
                -   type: directory
                    value: plugins/.*
        -   name: RouteDefSpec
            collectors:
                -   type: directory
                    value: src/Adapters/Router/RouteDefinition\.php
        -   name: TrustedProxy
            collectors:
                -   type: directory
                    value: src/Adapters/Http/TrustedProxyMatcher\.php
        -   name: OtlpExporter
            collectors:
                -   type: directory
                    value: src/Infrastructure/Observability/OtlpHttpJsonExporter\.php
        -   name: OriginPolicySpec
            collectors:
                -   type: directory
                    value: src/Application/Security/OriginPolicy\.php
        -   name: ContainerImpl
            collectors:
                -   type: directory
                    value: src/Application/Container/Container\.php
    ruleset:
        Domain:
            - Compat
            - RouteDefSpec
            - TrustedProxy
            - OriginPolicySpec
            - ContainerImpl
        Compat: []
        RouteDefSpec:
            - Domain
            - Compat
        TrustedProxy:
            - Domain
            - Compat
        OtlpExporter:
            - Domain
            - Application
            - Infrastructure
            - Compat
        OriginPolicySpec:
            - Domain
            - Adapters
            - Compat
        ContainerImpl:
            - Domain
            - Application
            - Compat
        Application:
            - Domain
            - Compat
            - TrustedProxy
            - OtlpExporter
            - ContainerImpl
        Infrastructure:
            - Domain
            - Application
            - Compat
        Adapters:
            - Domain
            - Application
            - Infrastructure
            - Compat
            - ContainerImpl
            - TrustedProxy
            - OriginPolicySpec
        App:
            - Domain
            - Application
            - Infrastructure
            - Adapters
            - Compat
            - ContainerImpl
            - OriginPolicySpec
            - Module
            - Plugin
        Module:
            - Domain
            - Application
            - Infrastructure
            - Adapters
            - Compat
            - ContainerImpl
        Plugin:
            - Domain
            - Application
            - Infrastructure
            - Adapters
            - Compat
            - ContainerImpl
