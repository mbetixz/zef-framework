# ZEF Framework — architecture conformance (hexagonal layering).
#
#   composer deptrac
#
# Base layers mirror the physical directories produced by the v2.7.0
# hexagonal split: Domain has zero outward dependencies, Application may
# only depend on Domain, Infrastructure on Domain+Application, and
# Adapters/App/Module/Plugin may use everything below them.
#
# Exception layers (deliberate, documented deviations):
#   - Compat:        PSR shim interfaces — pure contracts, allowed everywhere.
#   - OtlpExporter:  Zef\Framework\Observability\OtlpHttpJsonExporter —
#                    default exporter wired by the Telemetry facade.
#   - ContainerImpl: Zef\Framework\Container\Container — the provider
#                    contracts (ServiceProviderInterface & friends) expose
#                    the concrete container in their signatures.
#
# Retired carve-outs (issue #36 exit ramp — history, kept honest):
#   - TrustedProxy: Zef\Framework\Http\TrustedProxyMatcher — moved unchanged
#                    to src/Domain/Http (pure static CIDR-matching helper; no
#                    state, no I/O), so the Application client-address resolver
#                    and the Adapters request factory now resolve it as a
#                    Domain class via ordinary layer rules.
#   - EnvConfig:     Zef\Framework\Foundation\Env — moved unchanged to
#                    src/Domain/Foundation (pure typed getenv() wrapper); all
#                    38 static call sites now resolve to a Domain class. A
#                    future instance-based EnvInterface port for
#                    composition-root injection stays open on issue #36.
#   - KernelSleeper: Zef\Framework\Runtime\BlockingSleeper — replaced by the
#                    SleeperInterface port + SystemSleeper default in
#                    src/Domain/Runtime; BlockingSleeper itself stays in
#                    Adapters as the untouched static public API.
#   - RouteDefSpec: Zef\Framework\Router\RouteDefinition — moved unchanged
#                    to src/Domain/Router (pure route spec value object; only
#                    dependency is the Domain HttpMethodValidator), so the
#                    Domain config aggregator now resolves it intra-Domain.
#   - OriginPolicySpec: Zef\Framework\Security\OriginPolicy — moved
#                    unchanged to src/Domain/Security (pure origin
#                    normalisation helper; only dependency is the Domain
#                    InvalidConfigurationException), so the Domain security
#                    policy aggregator now resolves it intra-Domain.
deptrac:
    paths:
        - ./src
        - ./modules
        - ./plugins
    layers:
        -   name: Domain
            collectors:
                -   type: directory
                    value: src/Domain/.*
        -   name: Application
            collectors:
                -   type: directory
                    value: src/Application/(?!Container/Container\.php).*
        -   name: Infrastructure
            collectors:
                -   type: directory
                    value: src/Infrastructure/(?!Observability/OtlpHttpJsonExporter\.php).*
        -   name: Adapters
            collectors:
                -   type: directory
                    value: src/Adapters/.*
        -   name: Compat
            collectors:
                -   type: directory
                    value: src/Compat/.*
        -   name: App
            collectors:
                -   type: directory
                    value: src/Bootstrap\.php
                -   type: directory
                    value: src/Middleware/.*
        -   name: Module
            collectors:
                -   type: directory
                    value: modules/.*
        -   name: Plugin
            collectors:
                -   type: directory
                    value: plugins/.*
        -   name: OtlpExporter
            collectors:
                -   type: directory
                    value: src/Infrastructure/Observability/OtlpHttpJsonExporter\.php
        -   name: ContainerImpl
            collectors:
                -   type: directory
                    value: src/Application/Container/Container\.php
    ruleset:
        Domain:
            - Compat
            - ContainerImpl
        Compat: []
        OtlpExporter:
            - Domain
            - Application
            - Infrastructure
            - Compat
        ContainerImpl:
            - Domain
            - Application
            - Compat
        Application:
            - Domain
            - Compat
            - OtlpExporter
            - ContainerImpl
        Infrastructure:
            - Domain
            - Application
            - Compat
        Adapters:
            - Domain
            - Application
            - Infrastructure
            - Compat
            - ContainerImpl
        App:
            - Domain
            - Application
            - Infrastructure
            - Adapters
            - Compat
            - ContainerImpl
            - Module
            - Plugin
        Module:
            - Domain
            - Application
            - Infrastructure
            - Adapters
            - Compat
            - ContainerImpl
        Plugin:
            - Domain
            - Application
            - Infrastructure
            - Adapters
            - Compat
            - ContainerImpl
