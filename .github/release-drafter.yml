# Konfigurasi Release Drafter.
# Memperbaiki kegagalan 8/8 run: release-drafter@v6 gagal karena
# "Configuration file .github/release-drafter.yml is not found".
# File ini WAJIB berada di default branch.

# Issue #88: template lama "v$NEXT_PATCH_VERSION" tanpa version-resolver
# hanya bisa menghitung patch bump — draft otomatis v2.17.1 salah label
# untuk konten tiga rilis fitur. Default kini MINOR (kadensi rilis repo:
# setiap minor = batch fitur aditif); PATCH hanya lewat label eksplisit
# `patch` (hotfix), MAJOR lewat label `breaking`.
name-template: "v$NEXT_MINOR_VERSION"
tag-template: "v$NEXT_MINOR_VERSION"

version-resolver:
  major:
    labels: ["breaking"]
  patch:
    labels: ["patch"]
  default: minor

categories:
  - title: "Features"
    labels: ["feature", "enhancement"]
  - title: "Bug Fixes"
    labels: ["fix", "bugfix", "bug"]
  - title: "Security"
    labels: ["security"]
  - title: "Maintenance"
    labels: ["chore", "maintenance", "dependencies"]
  - title: "Documentation"
    labels: ["documentation", "docs"]

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

no-changes-template: "- Tidak ada perubahan."

template: |
  ## Perubahan

  $CHANGES

  **Perubahan penuh**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$NEXT_MINOR_VERSION

autolabeler:
  # Issue #88: aturan lama berbasis FILE saja tidak pernah menyentuh merge
  # commit berjudul conventional ("feat: ...", "fix: ..."), sehingga kategori
  # Features / Bug Fixes selalu kosong dan resolver tidak punya sinyal.
  # Aturan TITLE berikut mengisi kategori + memberi resolver sinyal versi.
  - label: "breaking"
    title: '^([a-z]+(\([^)]*\))?)?!:|BREAKING CHANGE'
  - label: "feature"
    title: '^feat(\([^)]*\))?:'
  - label: "fix"
    title: '^fix(\([^)]*\))?:'
  - label: "documentation"
    title: '^docs(\([^)]*\))?:'
  - label: "chore"
    title: '^chore(\([^)]*\))?:'
  - label: "documentation"
    files: ["*.md", "docs/**"]
  - label: "dependencies"
    files: ["composer.json", "composer.lock"]
  - label: "security"
    files: ["SECURITY.md", ".github/workflows/secret-scan.yml"]
