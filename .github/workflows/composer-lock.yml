name: Composer Lock Bootstrap

on:
  workflow_dispatch:

# On-demand bootstrap: resolves composer.lock and commits it when out of
# sync. The routine push trigger was removed - the lock/composer.json sync
# invariant is already gated on every push and pull request by ci.yml
# ("composer validate --strict"), and under the strict branch protection on
# main (required checks + enforce_admins) a GITHUB_TOKEN push from this
# workflow would be rejected anyway. With no push trigger, the commit job
# no longer renders as permanently "skipped" on every merge to main; it
# only appears in explicit manual dispatch runs, where a skip truthfully
# means "lockfile already synchronized".

# IMPORTANT: manual-only is intentional; see the header of auto-fix.yml for
# the full rationale (a trigger would reintroduce a permanently-skipped job).

# Baseline: no workflow-level write authority. Only the commit job may write.
permissions:
  contents: read

concurrency:
  group: composer-lock
  cancel-in-progress: true

jobs:
  # Read-only resolution job. Dependency resolution NEVER runs with write authority:
  # the privileged commit job below runs no Composer command at all.
  resolve:
    name: Resolve composer.lock (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.decide.outputs.needed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.4"
          tools: composer

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f composer.lock ]; then
            echo "No composer.lock present; resolving fresh."
            composer update --prefer-dist --no-interaction --no-progress
          elif ! composer validate --strict; then
            echo "composer.lock is out of sync with composer.json; re-resolving."
            composer update --prefer-dist --no-interaction --no-progress
          else
            echo "composer.lock is already synchronized with composer.json."
          fi

      - name: Detect lockfile diff
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- composer.lock; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Lockfile unchanged; nothing to commit."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Lockfile changed; handing off to the privileged commit job."
          fi

      - name: Upload resolved lockfile
        if: steps.decide.outputs.needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composer-lock-resolved
          path: composer.lock
          if-no-files-found: error

  # Privileged job: limited to composer.lock, explicit dependency on the read-only job.
  commit:
    name: Commit composer.lock
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download resolved lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: composer-lock-resolved
          path: .

      - name: Commit composer.lock
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: update composer.lock"
          file_pattern: "composer.lock"
