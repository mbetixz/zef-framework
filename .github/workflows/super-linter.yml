name: Lint Code Base

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        # Gunakan v7 (versi stabil terbaru)
        uses: super-linter/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Linter PHP
          VALIDATE_PHP_BUILTIN: true
          VALIDATE_PHP_CODESNIFFER: true
          VALIDATE_PHP_CS_FIXER: true

          # Matikan linter bahasa lain
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_HTML: false
          VALIDATE_CSS: false
          VALIDATE_PYTHON: false
          VALIDATE_BASH: false

          # Exclude folder vendor/storage
          FILTER_REGEX_EXCLUDE: '.*(vendor/|node_modules/|storage/).*'
