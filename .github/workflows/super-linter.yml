name: Lint Code Base

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lint PHP
        uses: super-linter/super-linter@v7
        env:
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true

          # PHP only. Do not mix VALIDATE=true and VALIDATE=false.
          VALIDATE_PHP_BUILTIN: true
          VALIDATE_PHP_CODESNIFFER: true
          VALIDATE_PHP_CS_FIXER: true

          FILTER_REGEX_EXCLUDE: ".*(vendor/|node_modules/|storage/|\.php-cs-fixer\.cache).*"
