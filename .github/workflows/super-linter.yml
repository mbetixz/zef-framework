name: PHP Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP lint and style check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: php-cs-fixer

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find src tests -type f -name "*.php" -print 2>/dev/null || true)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP source/test files found."
            exit 0
          fi

          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: PHP-CS-Fixer dry run
        run: |
          php-cs-fixer fix src --rules=@PSR12 --dry-run --diff --using-cache=no
          php-cs-fixer fix tests --rules=@PSR12 --dry-run --diff --using-cache=no
