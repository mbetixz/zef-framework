name: PHP Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP lint, audit, static analysis and style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-quality-php-8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-quality-php-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find src tests -type f -name "*.php" -print 2>/dev/null || true)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP source/test files found."
            exit 0
          fi

          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Composer security audit
        run: composer audit --abandoned=fail

      - name: PHP-CS-Fixer check
        run: composer format:check

      - name: Rector check
        run: composer rector:check

      - name: PHPStan analysis
        run: composer stan
