name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer tag: $tag"
            exit 1
          fi

      - name: Verify required CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-list -n 1 "$GITHUB_REF")"

          for workflow in "PHP Test Matrix" "PHP Quality Gate" "CodeQL Security Analysis" "Deep QA"; do
            conclusion="$(gh run list --repo "${{ github.repository }}" --workflow "$workflow" --commit "$sha" --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
            if [ "$conclusion" != "success" ]; then
              echo "$workflow has not passed for $sha: $conclusion"
              exit 1
            fi
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Create source artifact
        run: |
          tar --exclude-vcs --exclude=build -czf "zef-framework-${GITHUB_REF_NAME}.tar.gz" .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             "zef-framework-${GITHUB_REF_NAME}.tar.gz"             --generate-notes             --verify-tag
