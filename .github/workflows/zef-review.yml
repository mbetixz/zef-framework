# =============================================================================
#  ZEF Review Agent — GitHub Actions workflow  ·  VERSI 3
#  Repo target: mbetixz/zef-framework
#
#  ATURAN UTAMA: file ini TIDAK memuat konfigurasi operasional.
#  Semua nilai dibaca dari GitHub Variables (vars.*) dan Secrets (secrets.*).
#  Ubah perilaku bot lewat:
#      Settings → Secrets and variables → Actions
#  Tidak perlu menyentuh file ini lagi.
#
#  URUTAN LANGKAH (alasan tiap posisi: README §2)
#    1. Buat installation token GitHub App   ← SELALU paling awal
#    2. Checkout (memakai token App, ref basis PR yang tepercaya)
#    3. Diagnostik runtime Node
#    4. Preflight konfigurasi (PRESENT/ABSENT + saklar tiga fase)
#    5. Jalankan reviewer (di dalamnya: Fase A → review → Fase B → Fase C)
#
#  PERMISSION BERSYARAT (v3)
#    - contents: write          HANYA bila ZEF_REVIEW_ENABLE_UPDATE_BRANCH
#                               atau ZEF_REVIEW_ENABLE_AUTO_MERGE aktif.
#                               Kalau tidak, contents tetap "read".
#    - permission-checks: write HANYA bila ZEF_REVIEW_ENABLE_BLOCK_ON_FINDINGS
#                               aktif (butuh membuat/memperbarui check run).
#    - pull-requests: write     HANYA bila ZEF_REVIEW_INLINE_COMMENTS aktif
#                               (komentar menempel di baris diff). Komentar
#                               ringkasan memakai issues: write, yang sudah
#                               dimiliki App — jadi tidak perlu pull_requests.
#                               Minta level yang TIDAK diberikan instalasi
#                               akan menggagalkan langkah token dengan 422.
#    Nilai input `permission-*` hanya bisa MEMPERSEMPIT token, tidak pernah
#    menambah. Saat fitur mati, input dikirim sebagai string kosong supaya
#    tidak meminta permission yang mungkin tidak dimiliki App.
#
#  ⚠️  Jangan lupa: ketiga fitur lanjutan DEFAULT MATI. Nyalakan satu per satu.
#
#  Daftar lengkap variabel + nilai default + contoh: kit/README.md
# =============================================================================

name: ZEF Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Nomor PR yang akan direview (untuk uji manual)'
        required: true
        type: string
      dry_run:
        description: 'true = analisis saja, jangan posting komentar / jangan ubah apa pun'
        required: false
        default: 'true'
        type: string

# Satu review aktif per PR. Push baru membatalkan run yang masih jalan,
# sehingga tidak ada dua komentar yang berlomba.
concurrency:
  group: zef-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

# Permission minimal untuk GITHUB_TOKEN bawaan. Langkah token App punya
# permission-nya sendiri di bawah, jadi GITHUB_TOKEN tidak perlu write.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    # Batas waktu job. Bentuk fromJSON dipakai supaya bisa diatur lewat
    # Variable tanpa mengedit file ini. WAJIB berupa bilangan bulat.
    timeout-minutes: ${{ fromJSON(vars.ZEF_REVIEW_JOB_TIMEOUT_MINUTES || '15') }}

    # Lewati: bot dimatikan lewat Variable, PR dari fork (rahasia tidak
    # diteruskan ke runner), dan komentar pada issue biasa (bukan PR).
    if: >-
      vars.ZEF_REVIEW_ENABLED != 'false'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
      && (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)

    steps:
      # ── 1. IDENTITAS BOT ──────────────────────────────────────────────────
      # SELALU paling awal. Tiga alasan:
      #   a) Langkah checkout berikutnya MEMERLUKAN token ini (identitas dulu,
      #      baru repositori) — dependensi berjalan satu arah saja.
      #   b) Token kedaluwarsa 1 jam; menaruhnya paling awal memaksimalkan
      #      jendela pemakaian dan menghindari token mati di tengah jalan.
      #   c) Bila identitas gagal, job berhenti SEBELUM menyentuh repositori.
      # Permission ditulis eksplisit & bersyarat: token hanya boleh sebanyak
      # yang benar-benar dipanggil skrip, bukan seluruh permission instalasi.
      - name: 1. Buat installation token (GitHub App)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # Isi SALAH SATU: client-id (disarankan action v3) atau app-id (legacy).
          client-id: ${{ vars.ZEF_REVIEW_APP_CLIENT_ID }}
          app-id: ${{ vars.ZEF_REVIEW_APP_ID }}
          private-key: ${{ secrets.ZEF_REVIEW_APP_PRIVATE_KEY }}
          # Cakupan: hanya repositori ini, bukan seluruh instalasi.
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # contents → write HANYA bila Fase A (update-branch) atau Fase C
          # (auto-merge) dinyalakan. Selain itu tetap read untuk checkout.
          permission-contents: >-
            ${{ (vars.ZEF_REVIEW_ENABLE_UPDATE_BRANCH == 'true'
                 || vars.ZEF_REVIEW_ENABLE_AUTO_MERGE == 'true') && 'write' || 'read' }}
          # pull-requests: default KOSONG (lihat catatan panjang di atas).
          # Membaca PR & diff cukup dengan level instalasi. Komentar ringkasan
          # memakai /issues/{n}/comments → butuh `issues: write`, bukan
          # pull_requests. Isi 'write' hanya untuk komentar inline.
          permission-pull-requests: >-
            ${{ vars.ZEF_REVIEW_INLINE_COMMENTS == 'true' && 'write' || '' }}
          # checks → write HANYA bila Fase B dinyalakan. Saat mati dikirim
          # kosong supaya tidak meminta permission yang mungkin tidak dimiliki
          # App (permintaan yang tidak bisa dipenuhi akan menggagalkan langkah
          # ini, dan itu terjadi sebelum apa pun berjalan).
          permission-checks: ${{ vars.ZEF_REVIEW_ENABLE_BLOCK_ON_FINDINGS == 'true' && 'write' || '' }}
          # Token dicabut otomatis di akhir job — tidak bisa diwariskan ke job lain.
          skip-token-revoke: 'false'

      # ── 2. CHECKOUT ───────────────────────────────────────────────────────
      # Diperlukan: skrip reviewer dijalankan DARI filesystem runner.
      # `ref` diambil dari BASIS PR, bukan dari kepala PR. Ini penting:
      # kalau penulis PR bisa menimpa .github/scripts/zef-review.mjs, ia bisa
      # menyuruh runner mengirim rahasia ke mana pun. Checkout dari ref
      # tepercaya menutup jalur itu — dan itu juga sebabnya berkas prompt
      # dibaca dari ref ini, bukan dari kepala PR.
      - name: 2. Checkout (ref tepercaya)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      # ── 3. DIAGNOSTIK ─────────────────────────────────────────────────────
      # Node 20+ sudah tersedia di runner; tidak ada action tambahan yang
      # perlu di-pin hanya untuk memastikan itu.
      # R2 — GUARD DILUNAKKAN (v3.1).
      # Sebelumnya: berkas tidak ada → `exit 1` → job MERAH untuk SETIAP PR.
      # Efeknya: selama pemasangan bertahap (skrip ada di branch, belum di ref
      # basis) semua PR tak bersalah menanggung check merah permanen.
      # Sekarang: TIDAK fatal — keluarkan ::warning:: dan lewati langkah 5
      # lewat kondisi `if`. Pengecualian: pada `workflow_dispatch` (uji manual)
      # berkas yang hilang TETAP fatal, karena uji manual yang "hijau" tanpa
      # menjalankan apa pun adalah gate palsu — justru jenis sinyal yang salah.
      - name: 3. Periksa runtime Node
        id: runtime
        run: |
          node --version
          if [ -f .github/scripts/zef-review.mjs ]; then
            echo "Skrip reviewer ditemukan: .github/scripts/zef-review.mjs"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            REF_USED="${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::.github/scripts/zef-review.mjs tidak ada di ref ini ($REF_USED). Uji manual tidak boleh dilaporkan hijau tanpa menjalankan apa pun."
              exit 1
            fi
            echo "::warning::.github/scripts/zef-review.mjs tidak ada di ref $REF_USED — langkah 5 DILEWATI. Job tidak digagalkan agar PR tak bersalah tidak mendapat check merah selama pemasangan bertahap. Selesaikan pemasangan (.github/scripts/** ke ref basis) lalu jalankan ulang."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 4. PREFLIGHT ──────────────────────────────────────────────────────
      # Melaporkan HANYA nama variabel + status PRESENT/ABSENT.
      # Tidak pernah mencetak nilai apa pun.
      - name: 4. Preflight konfigurasi
        env:
          S_APP_KEY: ${{ secrets.ZEF_REVIEW_APP_PRIVATE_KEY }}
          S_API_KEY: ${{ secrets.AGENT_AI_API_KEY }}
          V_AGENT_ID: ${{ vars.ZEF_REVIEW_AGENT_AGENT_ID }}
          V_BASE_URL: ${{ vars.ZEF_REVIEW_AGENT_BASE_URL }}
          V_MODE: ${{ vars.ZEF_REVIEW_TRIGGER_MODE }}
          V_DRY_RUN: ${{ vars.ZEF_REVIEW_DRY_RUN }}
          V_DRY_INPUT: ${{ inputs.dry_run }}
          V_PROMPT_INLINE: ${{ vars.ZEF_REVIEW_SYSTEM_PROMPT }}
          V_PROMPT_FILE: ${{ vars.ZEF_REVIEW_SYSTEM_PROMPT_FILE }}
          V_F_UPDATE: ${{ vars.ZEF_REVIEW_ENABLE_UPDATE_BRANCH }}
          V_F_CHECK: ${{ vars.ZEF_REVIEW_ENABLE_BLOCK_ON_FINDINGS }}
          V_F_MERGE: ${{ vars.ZEF_REVIEW_ENABLE_AUTO_MERGE }}
        run: |
          status() { if [ -n "${1:-}" ]; then echo "PRESENT"; else echo "ABSENT"; fi; }
          echo "ZEF_REVIEW_APP_PRIVATE_KEY     : $(status "$S_APP_KEY")"
          echo "AGENT_AI_API_KEY             : $(status "$S_API_KEY")"
          echo "ZEF_REVIEW_AGENT_AGENT_ID    : $(status "$V_AGENT_ID")"
          echo "ZEF_REVIEW_AGENT_BASE_URL    : $(status "$V_BASE_URL")"
          echo "ZEF_REVIEW_SYSTEM_PROMPT       : $(status "$V_PROMPT_INLINE") (inline)"
          echo "ZEF_REVIEW_SYSTEM_PROMPT_FILE  : $(status "$V_PROMPT_FILE") (berkas, menang atas inline)"
          echo "ZEF_REVIEW_TRIGGER_MODE        : ${V_MODE:-auto (default)}"
          echo "ZEF_REVIEW_DRY_RUN             : ${V_DRY_RUN:-true (default)}"
          echo "input dry_run (workflow_dispatch): ${V_DRY_INPUT:-(tidak ada — hanya terisi saat workflow_dispatch)}"
          if [ -n "${V_DRY_INPUT:-}" ]; then
            echo "  → input MENANG atas Variable untuk run ini (R3)."
          fi
          echo "--- Saklar fase lanjutan (DEFAULT MATI) ---"
          echo "ZEF_REVIEW_ENABLE_UPDATE_BRANCH      : ${V_F_UPDATE:-false (default)}"
          echo "ZEF_REVIEW_ENABLE_BLOCK_ON_FINDINGS  : ${V_F_CHECK:-false (default)}"
          echo "ZEF_REVIEW_ENABLE_AUTO_MERGE         : ${V_F_MERGE:-false (default)}"
          case "$V_BASE_URL" in
            */) echo "::warning::ZEF_REVIEW_AGENT_BASE_URL berakhiran garis miring; skrip menormalkannya." ;;
          esac
          case "$V_BASE_URL" in
            */v1) echo "::warning::ZEF_REVIEW_AGENT_BASE_URL berakhiran /v1. Skrip membuang akhiran itu, tapi lebih aman diisi tanpa /v1." ;;
          esac

      # ── 5. REVIEWER ───────────────────────────────────────────────────────
      # Urutan di dalam skrip: Fase A (sinkronisasi) → baca diff → LLM →
      # review → Fase B (check run) → Fase C (auto-merge) → perbarui ringkasan.
      - name: 5. Jalankan reviewer
        # R2: dilewati bila langkah 3 menandai skrip tidak ada di ref ini.
        if: steps.runtime.outputs.ready == 'true'
        run: node .github/scripts/zef-review.mjs
        env:
          # --- Konteks GitHub (otomatis) ---------------------------------
          # GITHUB_TOKEN di sini = installation token App, bukan token bawaan
          # Actions. Karena itu komentar muncul sebagai "<slug>[bot]" dan bisa
          # memicu workflow lain (perilaku yang GITHUB_TOKEN tidak punya).
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          EVENT_PATH: ${{ github.event_path }}
          WORKFLOW_INPUT_PR: ${{ inputs.pr_number }}

          # --- Secrets (Settings → Secrets and variables → Actions) -------
          AGENT_AI_API_KEY: ${{ secrets.AGENT_AI_API_KEY }}

          # --- Variables: identitas & tampilan ---------------------------
          ZEF_REVIEW_AGENT_NAME: ${{ vars.ZEF_REVIEW_AGENT_NAME }}
          ZEF_REVIEW_ENABLED: ${{ vars.ZEF_REVIEW_ENABLED }}
          ZEF_REVIEW_LANGUAGE: ${{ vars.ZEF_REVIEW_LANGUAGE }}
          ZEF_REVIEW_MARKER: ${{ vars.ZEF_REVIEW_MARKER }}

          # --- Variables: pemicu ------------------------------------------
          ZEF_REVIEW_TRIGGER_MODE: ${{ vars.ZEF_REVIEW_TRIGGER_MODE }}
          ZEF_REVIEW_MENTION: ${{ vars.ZEF_REVIEW_MENTION }}
          ZEF_REVIEW_MENTION_TRUST: ${{ vars.ZEF_REVIEW_MENTION_TRUST }}

          # --- Variables: endpoint LLM ------------------------------------
          ZEF_REVIEW_AGENT_BASE_URL: ${{ vars.ZEF_REVIEW_AGENT_BASE_URL }}
          ZEF_REVIEW_AGENT_AGENT_ID: ${{ vars.ZEF_REVIEW_AGENT_AGENT_ID }}
          ZEF_REVIEW_API_STYLE: ${{ vars.ZEF_REVIEW_API_STYLE }}
          ZEF_REVIEW_MODEL: ${{ vars.ZEF_REVIEW_MODEL }}
          ZEF_REVIEW_TIMEOUT_MS: ${{ vars.ZEF_REVIEW_TIMEOUT_MS }}

          # --- Variables: ukuran & cakupan diff ---------------------------
          ZEF_REVIEW_MAX_DIFF_BYTES: ${{ vars.ZEF_REVIEW_MAX_DIFF_BYTES }}
          ZEF_REVIEW_MAX_FILES: ${{ vars.ZEF_REVIEW_MAX_FILES }}
          ZEF_REVIEW_EXCLUDE_PATHS: ${{ vars.ZEF_REVIEW_EXCLUDE_PATHS }}

          # R3 (v3.1) — INPUT workflow_dispatch BENAR-BENAR BERLAKU.
          # Sebelumnya baris ini hanya `${{ vars.ZEF_REVIEW_DRY_RUN }}`, padahal
          # UI "Run workflow" menyediakan input `dry_run`. Akibatnya saklar yang
          # TERLIHAT (input) berbeda dari saklar yang BERLAKU (Variable) — kontrol
          # yang terlihat ≠ kontrol yang berlaku, itu bug keamanan.
          # Kini: input menang bila diisi; jika kosong (event pull_request /
          # issue_comment) jatuh ke Variable. Tetap SATU saklar yang dibaca skrip
          # (ZEF_REVIEW_DRY_RUN) sehingga tidak ada dua sumber kebenaran.
          ZEF_REVIEW_DRY_RUN: ${{ inputs.dry_run || vars.ZEF_REVIEW_DRY_RUN }}

          # --- Variables: prompt ------------------------------------------
          # Berkas MENANG atas inline bila keduanya diisi — lihat README §3.4.
          ZEF_REVIEW_SYSTEM_PROMPT_FILE: ${{ vars.ZEF_REVIEW_SYSTEM_PROMPT_FILE }}
          ZEF_REVIEW_SYSTEM_PROMPT: ${{ vars.ZEF_REVIEW_SYSTEM_PROMPT }}
          # Diperbaiki di paket v3: baris ini sebelumnya HILANG, sehingga
          # Variable ZEF_REVIEW_PROMPT_MAX_BYTES tidak pernah sampai ke runner
          # walau sudah dibaca skrip dan dipasang setup-vars.mjs.
          ZEF_REVIEW_PROMPT_MAX_BYTES: ${{ vars.ZEF_REVIEW_PROMPT_MAX_BYTES }}
          ZEF_REVIEW_EXTRA_INSTRUCTIONS: ${{ vars.ZEF_REVIEW_EXTRA_INSTRUCTIONS }}

          # --- Variables: FASE A — sinkronisasi branch (DEFAULT MATI) ------
          ZEF_REVIEW_ENABLE_UPDATE_BRANCH: ${{ vars.ZEF_REVIEW_ENABLE_UPDATE_BRANCH }}
          ZEF_REVIEW_UPDATE_BRANCH_ALLOW_FORK: ${{ vars.ZEF_REVIEW_UPDATE_BRANCH_ALLOW_FORK }}
          ZEF_REVIEW_UPDATE_BRANCH_REQUIRE_STRICT: ${{ vars.ZEF_REVIEW_UPDATE_BRANCH_REQUIRE_STRICT }}

          # --- Variables: FASE B — check run (DEFAULT MATI) ---------------
          ZEF_REVIEW_ENABLE_BLOCK_ON_FINDINGS: ${{ vars.ZEF_REVIEW_ENABLE_BLOCK_ON_FINDINGS }}
          ZEF_REVIEW_CHECK_NAME: ${{ vars.ZEF_REVIEW_CHECK_NAME }}
          ZEF_REVIEW_BLOCK_SEVERITY: ${{ vars.ZEF_REVIEW_BLOCK_SEVERITY }}

          # --- Variables: FASE C — auto-merge (DEFAULT MATI) --------------
          ZEF_REVIEW_ENABLE_AUTO_MERGE: ${{ vars.ZEF_REVIEW_ENABLE_AUTO_MERGE }}
          ZEF_REVIEW_AUTO_MERGE_METHOD: ${{ vars.ZEF_REVIEW_AUTO_MERGE_METHOD }}
          ZEF_REVIEW_AUTO_MERGE_BLOCK_SEVERITY: ${{ vars.ZEF_REVIEW_AUTO_MERGE_BLOCK_SEVERITY }}
