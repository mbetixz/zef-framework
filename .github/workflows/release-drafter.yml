name: Release Drafter

on:
  push:
    branches: ["main"]

# Baseline: no workflow-level write authority; grant only to the job that needs it.
permissions:
  contents: read

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required: creates/updates the draft release
      pull-requests: read # required: reads merged PRs to build the changelog
    steps:
      - name: Draft release
        uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6.4.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
