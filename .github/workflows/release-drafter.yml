name: Release Drafter

on:
  push:
    branches: ["main"]

# Baseline: no workflow-level write authority; grant only to the job that needs it.
permissions:
  contents: read

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required: creates/updates the draft release
      pull-requests: read # required: reads merged PRs to build the changelog
    steps:
      - name: Draft release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
