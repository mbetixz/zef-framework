name: PHP Test Matrix

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / ${{ matrix.os }} / ${{ matrix.dependency }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php: "8.4"
            dependency: lowest
          - os: ubuntu-latest
            php: "8.4"
            dependency: highest
          - os: ubuntu-latest
            php: "8.5"
            dependency: highest
          - os: windows-latest
            php: "8.4"
            dependency: highest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.dependency }}" = "lowest" ]; then
            composer update --prefer-dist --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer install --prefer-dist --no-interaction --no-progress
          fi

      - name: Run PHPUnit
        run: composer test
