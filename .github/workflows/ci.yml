name: Master CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / ${{ matrix.os }} / ${{ matrix.dependency }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            php: "8.4"
            dependency: lowest
          - os: ubuntu-24.04
            php: "8.4"
            dependency: highest
          - os: ubuntu-24.04
            php: "8.5"
            dependency: highest
          - os: windows-latest
            php: "8.4"
            dependency: highest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.dependency }}" = "lowest" ]; then
            composer update --prefer-dist --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer install --prefer-dist --no-interaction --no-progress
          fi

      - name: Run PHPUnit
        run: composer test

  quality:
    name: PHP lint, audit, static analysis and style
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-quality-php-8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-quality-php-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find src tests -type f -name "*.php" -print 2>/dev/null || true)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP source/test files found."
            exit 0
          fi

          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Composer security audit
        run: composer audit --locked --abandoned=fail

      - name: Composer platform requirements
        run: composer check-platform-reqs

      - name: PHP-CS-Fixer check
        run: composer format:check

      - name: Rector check
        run: composer rector:check

      - name: PHPStan analysis
        run: composer stan

      - name: Deptrac architecture analysis
        run: composer deptrac

  deep-qa:
    name: Deep QA / Mutation Testing
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      )
    needs:
      - test
      - quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: pcov
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Mutation testing
        run: composer mutation:ci

      - name: Detect benchmarks
        id: bench
        shell: bash
        run: |
          if find tests/Benchmark -type f -name "*.php" -print -quit 2>/dev/null | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: PHPBench
        if: steps.bench.outputs.ready == 'true'
        run: composer bench
