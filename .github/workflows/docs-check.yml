name: API Documentation Check

on:
  pull_request:
    branches: ["main"]

# Read-only documentation build for pull requests. The deploy half of the
# pipeline lives in pages.yml (push to main / workflow_dispatch only), so a
# pull request never queues a deploy job that would render as "skipped".
# The job name below is load-bearing: it must stay exactly
# "Build API documentation" to satisfy the required status check context
# configured on the protected main branch.
permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build API documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate API documentation (Doctum)
        run: composer docs

      # Official documentation site (curated Markdown -> static HTML). Built
      # read-only here so a pull request that breaks the docs renderer or the
      # published navigation fails before merge, matching pages.yml.
      - name: Build official documentation site
        run: |
          set -euo pipefail
          php scripts/build_docs.php
          mkdir -p build/docs/api
          cp -R build/api/. build/docs/api/

      - name: Verify documentation output
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s build/api/index.html ]; then
            echo "::error::Doctum produced no build/api/index.html - the docs build is broken."
            exit 1
          fi

          echo "API documentation generated: $(find build/api -type f | wc -l) files under build/api."

          for page in index installation cli architecture quality deployment; do
            if [ ! -s "build/docs/${page}.html" ]; then
              echo "::error::Documentation page build/docs/${page}.html is missing or empty."
              exit 1
            fi
          done

          if [ ! -s build/docs/api/index.html ]; then
            echo "::error::The Doctum API reference was not merged into build/docs/api."
            exit 1
          fi

          echo "Documentation site generated: $(find build/docs -type f | wc -l) files under build/docs."
