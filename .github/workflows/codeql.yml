name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Berjalan otomatis setiap hari Senin pukul 03:00 UTC
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze PHP Code
    runs-on: ubuntu-latest
    permissions:
      # Diperlukan untuk membaca repository dan menulis hasil SARIF ke tab Security
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'php' ]
        # Opsi query: 'default' (standar) atau 'security-extended' (lebih mendalam/ketat)
        build-mode: [ 'none' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Inisialisasi mesin CodeQL untuk bahasa PHP
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Menggunakan aturan keamanan yang lebih luas (sangat direkomendasikan)
        queries: security-extended

    # Jalankan analisis CodeQL (PHP adalah bahasa yang tidak perlu di-compile)
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
