name: Auto Fix Code Style

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHP-CS-Fixer
        run: composer format

      - name: Commit changes automatically
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto fix coding standards via PHP-CS-Fixer"
          file_pattern: "src/**/*.php tests/**/*.php"
