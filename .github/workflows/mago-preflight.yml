name: Mago Preflight (advisory)

# ADVISORY WORKFLOW - READ BEFORE CHANGING.
# ---------------------------------------------------------------------------
# This workflow exists to give fast, cheap, early feedback on a pull request,
# and to let a provisioning change be verified on demand via workflow_dispatch.
# It is deliberately NOT a gate:
#
#   * It is NOT in the required status check list on `main`. The six required
#     contexts are "PHP lint, audit, static analysis and style", "Analyze
#     (actions)", dependency-review, gitleaks, PHPBench and "Build API
#     documentation" - Mago is none of them. Adding it there requires an owner
#     decision plus an audit of Mago's real findings.
#   * `scripts/ci/mago-preflight.sh` is written to always exit 0 (`set -uo
#     pipefail` deliberately without `-e`, plus a final `exit 0`), and THAT is
#     now the only thing making the collection step non-blocking. The job-level
#     `continue-on-error: true` that used to sit beside it has been REMOVED; see
#     the note inside the job for why. A Mago wobble still cannot block a merge.
#   * It publishes nothing: `permissions: contents: read`, and no step commits,
#     pushes or opens anything. The pre-seed step below does create files, but
#     only inside the runner's own gitignored `vendor/` working tree, which is
#     discarded along with the runner.
#
# F-1 - WHY THE BINARY IS PRE-SEEDED BELOW.
# `carthage-software/mago` downloads a native binary at runtime, on first use of
# `vendor/bin/mago`, and verifies NOTHING: the lockfile records `"shasum": ""`
# and the wrapper's provisioning source has no checksum/signature/attestation
# check at all. A version pin therefore does not constrain the integrity of the
# artifact that gets executed. The `Seed the verified Mago binary` step below
# downloads the release tarball, verifies a pinned sha256, verifies the inner
# binary, and places it where the wrapper's `file_exists()` short-circuit finds
# it - so the unverified download path is never entered.
#
# A version pin is NECESSARY BUT NOT SUFFICIENT, so there are two independent
# controls: `composer.json` pins the package to the exact `1.49.0` (this branch
# carries that pin; the caret range it replaced is what let a lockfile refresh
# move the wrapper's download target silently), AND the seed script asserts that
# the version Composer actually resolved equals MAGO_VERSION and fails closed
# otherwise. Keep the two in step.
#
# The seed step must NEVER carry `continue-on-error: true`. A silent seed failure
# would leave Mago free to download an unverified binary, which is exactly the
# condition this workflow now exists to prevent. To be precise about what was
# removed: the flag was at JOB level, not on the collection step - the collection
# step has never carried one. The script re-asserts this invariant in its own
# comments.
#
# The LAST step is a read-only `always()` diagnostic (U-13). It exists so the
# state of the seeded binary is observed from inside the run - including on a
# FAILING run, which is the only run that carries the evidence a negative control
# needs. It disables errexit and closes with an explicit `exit 0`, so it can
# neither mask nor manufacture a result: the job conclusion still comes from the
# seed step alone.
#
# This is a SEPARATE workflow on purpose rather than an extra job inside
# ci.yml: adding a job to ci.yml would change the composition of the existing
# required check ("PHP lint, audit, static analysis and style") and could alter
# what that context means. A new context cannot silently re-scope an old one.
#
# Authorities are unchanged:
#   PHP-CS-Fixer -> formatting    PHPStan -> static/type analysis
#   Deptrac -> architecture       PHPUnit -> runtime behaviour
#   Semgrep -> security patterns  Gitleaks -> secrets

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned provisioning inputs for the Mago native binary (see the F-1 note in
  # the header). Every value is immutable on purpose and mirrors the convention
  # already used by php-sast.yml. Bumping MAGO_VERSION requires re-pinning BOTH
  # digests in the same commit - the seed script asserts that the version
  # resolved by Composer equals MAGO_VERSION and fails closed otherwise, so a
  # lockfile refresh can never silently bypass the pin.
  #
  # Exact release to be provisioned (not a caret range). Quoted so YAML cannot
  # reinterpret it.
  MAGO_VERSION: "1.49.0"
  # Release asset triple for the runner. `ubuntu-24.04` is glibc x86_64. The
  # wrapper derives this from detect_linux_libc(), so a musl or arm64 runner
  # needs its own triple AND its own digests.
  MAGO_TRIPLE: "x86_64-unknown-linux-gnu"
  # sha256 of mago-1.49.0-x86_64-unknown-linux-gnu.tar.gz, corroborated from two
  # independent sources: the release API per-asset `digest` and a local re-hash
  # of an actual download.
  MAGO_TARBALL_SHA256: "32248cbd418fa88522bcacdee8591f5a35cf25db11045f70cefe8b7cdde424ef"
  # sha256 of the `mago` ELF extracted from that verified tarball (30,359,864
  # bytes). Pinning the inner artifact as well means a release whose tarball was
  # left intact but whose binary was swapped would still be caught.
  MAGO_BINARY_SHA256: "b08fba538d0f2bca334d0423a68ac326f9888b616b96da7a5a0f8c2694cc02bc"

concurrency:
  group: mago-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mago-preflight:
    name: Mago preflight (advisory)
    runs-on: ubuntu-24.04
    # `continue-on-error: true` used to sit here as belt-and-braces on top of the
    # script's own `exit 0`. It has been REMOVED deliberately.
    #
    # What that flag actually did is a property of GitHub Actions, not a claim
    # about any particular run: it intercepted a failing job's conclusion and
    # rewrote it to success, so a failure in the pre-seed step below would have
    # been absorbed and the job would have reported green. It was NOT what made
    # the job non-blocking - that is carried by (a) `scripts/ci/mago-preflight.sh`
    # always exiting 0 and (b) this job not being a required status check. Removing
    # it therefore costs nothing in advisory character and restores the only
    # signal that could distinguish "seed could not be proven" from "seed fine".
    #
    # Consequence for reviewers: a red run of this job now means "the advice could
    # not be collected safely", never "your change is bad". It still cannot block a
    # merge, because it is not a required status check.
    #
    # Already observed on a real runner: an N-3 run on this branch with a
    # deliberately wrong tarball digest ended `failure` at the seed step while the
    # `always()` diagnostic still reported `success`, demonstrating both that the
    # failure is no longer absorbed and that it is not masked by the diagnostic.

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Seed the verified Mago binary
        id: seed
        # Closes F-1 for the CI path: provisions the native binary with pinned
        # sha256 verification BEFORE anything executes it, so the wrapper's own
        # unverified download path is never entered (it short-circuits on
        # file_exists at composer/src/internal.php:549).
        #
        # FAIL-CLOSED, and intentionally WITHOUT `continue-on-error`: if the seed
        # cannot be proven, this step fails and the job stops here. It must never
        # fall through to a download that nothing verifies.
        run: bash scripts/ci/seed-mago-binary.sh

      - name: Collect advisory static-quality signals
        # Non-blocking by construction. Writes a comparison table plus a
        # cross-tool verdict (AGREE_CLEAN / AGREE_ISSUES / CONFLICTED / UNKNOWN)
        # to the job summary. A disagreement is reported as CONFLICTED - it is
        # never resolved by majority vote.
        run: bash scripts/ci/mago-preflight.sh

      - name: Diagnose the Mago binary provisioning (always)
        # U-13 - closes the last INFERENCE in the N-3 evidence chain.
        #
        # Why this step exists: the earlier negative control proved the seed was
        # fail-closed, but "no binary was left behind at the target path" had to
        # be INFERRED from the log, because a GitHub-hosted runner is destroyed
        # when the job ends and its filesystem can no longer be inspected. This
        # step takes that reading INSIDE the run, so the claim becomes directly
        # observed rather than inferred.
        #
        # Safety properties, all deliberate:
        #   * `if: always()` - so it also runs on the FAILING run. That run is
        #     the only one that carries the evidence we want; a diagnostic that
        #     only ran on success would be useless for a negative control.
        #   * `set +e` - Actions' default shell is `bash -e {0}`, so errexit is
        #     already ON. Without disabling it, the first failing diagnostic
        #     command would abort the step and change the job conclusion.
        #   * explicit `exit 0` - this step must NEVER alter the job's result.
        #     The conclusion still comes from the seed step alone, so the
        #     diagnostic can neither mask nor manufacture a seed failure.
        #   * read-only - find / stat / sha256sum / ls only. It writes nothing,
        #     adds no permission, and introduces no new gate or required check.
        if: always()
        env:
          SEED_OUTCOME: ${{ steps.seed.outcome }}
        run: |
          set +e
          echo "=== U-13 diagnostic: Mago binary provisioning ==="
          echo "seed-step-outcome: ${SEED_OUTCOME:-<none>}"
          echo "mago-version-pin:  ${MAGO_VERSION:-<unset>}"
          echo "mago-triple-pin:   ${MAGO_TRIPLE:-<unset>}"
          echo "binary-sha256-pin: ${MAGO_BINARY_SHA256:-<unset>}"

          BIN_DIR="vendor/carthage-software/mago/composer/bin"
          # Derived the same way the wrapper derives it (internal.php:545-547):
          #   $storageDir = "mago-{$version}-{$triple}"; $releaseDir = "{$binDir}/{$version}";
          #   $executablePath = "{$releaseDir}/{$storageDir}/mago";
          # The first revision of this step omitted the "mago-${version}-${triple}"
          # component and therefore probed the WRONG path - a self-inflicted probe
          # defect caught by reading back its own output in the failing run.
          TARGET="${BIN_DIR}/${MAGO_VERSION}/mago-${MAGO_VERSION}-${MAGO_TRIPLE}/mago"
          echo "bin-dir:     ${BIN_DIR}"
          echo "target-file: ${TARGET}"

          if [ -e "${TARGET}" ]; then
            echo "TARGET: PRESENT"
            ls -l "${TARGET}" 2>&1 || true
            size="$(stat -c '%s' "${TARGET}" 2>/dev/null)"
            hash="$(sha256sum "${TARGET}" 2>/dev/null | awk '{print $1}')"
            echo "target-size-bytes: ${size}"
            echo "target-sha256:     ${hash}"
            if [ -n "${MAGO_BINARY_SHA256:-}" ] && [ "${hash}" = "${MAGO_BINARY_SHA256}" ]; then
              echo "target-digest-matches-pin: YES"
            else
              echo "target-digest-matches-pin: NO"
            fi
          else
            echo "TARGET: ABSENT (no binary at the path the wrapper trusts)"
          fi

          echo "--- listing ${BIN_DIR} (max depth 6) ---"
          if [ -d "${BIN_DIR}" ]; then
            find "${BIN_DIR}" -maxdepth 6 -printf '%y %10s %p\n' 2>/dev/null || true
          else
            echo "(bin dir absent)"
          fi
          echo "=== end U-13 diagnostic ==="
          exit 0
